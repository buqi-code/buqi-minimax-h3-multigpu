name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          ref: 7fbcfa8be9a8f47cf905ec47978b5bd754959ea7
          path: ComfyUI
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt
      - name: Install ComfyUI dependencies
        run: python -m pip install -r ComfyUI/requirements.txt
      - name: Run unit tests
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run two-rank CPU parity
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: torchrun --standalone --nproc-per-node=2 tests/test_current_api.py
      - name: Compile Python sources
        run: python -m compileall -q __init__.py minimax_sp tests
      - name: Parse workflow JSON
        run: python -c 'import json, pathlib; files=list(pathlib.Path("examples").glob("*.json")); assert files; [json.loads(p.read_text(encoding="utf-8")) for p in files]; print(f"parsed {len(files)} workflows")'
